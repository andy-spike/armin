name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Each matrix entry updates the same GitHub release. Serialize publishing
      # so only one job can create or update that release at a time.
      max-parallel: 1
      matrix:
        include:
          - name: Linux AppImage
            runner: ubuntu-latest
          - name: Windows x64 installer
            runner: windows-latest
          - name: macOS Apple silicon ZIP
            runner: macos-latest
          - name: macOS Intel ZIP
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux AppImage dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npm run icons --workspace apps/desktop

      - name: Record publish start time
        shell: bash
        run: echo "PUBLISH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Publish release artifacts
        run: npm run publish --workspace apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-forge publish can exit 0 without uploading anything (e.g.
      # the yauzl@2 silent failure on Node 24.16+, electron/forge#4277), so
      # fail unless this job actually created or refreshed release assets.
      - name: Verify release asset was uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./apps/desktop/package.json').version")"
          uploaded=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq "[.assets[] | select(.updated_at >= \"${PUBLISH_STARTED_AT}\")] | length")
          if [ "${uploaded}" -eq 0 ]; then
            echo "::error::Publish exited 0 but no assets on ${tag} were created or updated after ${PUBLISH_STARTED_AT}."
            exit 1
          fi
          echo "${uploaded} asset(s) uploaded to ${tag}."

  # Push the armin-bin PKGBUILD to the Arch User Repository. No-op when the
  # AUR_SSH_PRIVATE_KEY secret is not configured. See packaging/aur/README.md.
  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set; skipping the AUR update."
            echo "SKIP_AUR=true" >> "$GITHUB_ENV"
            exit 0
          fi
          install -dm700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Update PKGBUILD for this release
        if: env.SKIP_AUR != 'true'
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          curl -fsSL -o "Armin-${version}-x64.AppImage" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/Armin-${version}-x64.AppImage"
          appimage_hash="$(sha256sum "Armin-${version}-x64.AppImage" | cut -d' ' -f1)"
          desktop_hash="$(sha256sum packaging/aur/armin.desktop | cut -d' ' -f1)"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${appimage_hash}' '${desktop_hash}')/" \
            packaging/aur/PKGBUILD
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Generate .SRCINFO
        if: env.SKIP_AUR != 'true'
        run: |
          # makepkg refuses to run as root; setpriv drops to an unprivileged
          # numeric UID inside the container.
          docker run --rm -v "$PWD/packaging/aur:/work" -w /work archlinux:latest \
            setpriv --reuid=1000 --regid=1000 --clear-groups \
            makepkg --printsrcinfo > packaging/aur/.SRCINFO
          cat packaging/aur/.SRCINFO

      - name: Push to the AUR
        if: env.SKIP_AUR != 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/armin-bin.git aur-repo
          cd aur-repo
          cp ../packaging/aur/PKGBUILD ../packaging/aur/.SRCINFO ../packaging/aur/armin.desktop .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO armin.desktop
          git commit -m "Update to v${VERSION}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes" git push
