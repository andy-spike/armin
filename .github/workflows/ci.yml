name: CI

on:
  pull_request:
    branches:
      - master
  workflow_call:

# Cancel superseded runs on the same branch/PR. A new push cancels the
# in-progress run for the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installs Vite+, the Node version in .node-version, and the pnpm version
      # pinned by package.json's packageManager field, then runs `vp install`.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      # Formatting, lint, and type checks for every workspace in one pass.
      - name: Check
        run: pnpm check

      # Convex code in packages/backend/convex/_generated is committed; refresh
      # it locally with `pnpm --filter @armin/backend codegen` after backend changes.
      - name: Build web app
        run: pnpm --filter @armin/web build

      - name: Check mobile bundles
        run: pnpm --filter ./apps/mobile check:bundle
