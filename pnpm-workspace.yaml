packages:
  - apps/*
  - packages/*

# Electron Forge and the desktop app's native-module packaging hook expect a
# flat node_modules (see apps/desktop/forge.config.ts and ADR 0002). React
# Native / Expo has the same requirement, so hoisting stays repo-wide.
nodeLinker: hoisted

# Lifecycle hooks such as `pretest` rebuild better-sqlite3 for the runtime that
# is about to load it (apps/desktop ADR 0012).
enablePrePostScripts: true

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  workerd: true

overrides:
  "@electron/rebuild": 4.0.4
  yauzl: ^3.3.1

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.29"
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/prebuild-config@57.0.18"
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - expo-crypto@57.0.4
  - miniflare@5.20261006.2-beta
  - wrangler@4.150.0
