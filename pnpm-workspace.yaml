packages:
  - apps/*
  - packages/*

# Expo requires a hoisted workspace dependency layout.
nodeLinker: hoisted

# Vite+ (`vp env`) selects Node and pnpm; pnpm shouldn't fight it.
runtimeOnFail: ignore
pmOnFail: ignore

allowBuilds:
  # Better Auth still resolves this native dependency transitively.
  better-sqlite3: true
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.29"
  - "@expo/fingerprint@0.20.14"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - "@expo/prebuild-config@57.0.18"
  - babel-preset-expo@57.0.15
  - expo-modules-autolinking@57.0.15
  - expo-modules-core@57.0.22
  - expo-modules-jsi@57.1.2
  - expo@57.0.28
  - expo-crypto@57.0.4
  - miniflare@5.20261006.2-beta
  - wrangler@4.150.0
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
  - vite-plus@1.4.0

patchedDependencies:
  '@tanstack/start-server-core': patches/@tanstack__start-server-core.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
