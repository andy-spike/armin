packages:
  - apps/*
  - packages/*

# Electron Forge and the desktop app's native-module packaging hook expect a
# flat node_modules (see apps/desktop/forge.config.ts and ADR 0002). React
# Native / Expo has the same requirement, so hoisting stays repo-wide.
nodeLinker: hoisted

# Lifecycle hooks such as `pretest` rebuild better-sqlite3 for the runtime that
# is about to load it (apps/desktop ADR 0012).
enablePrePostScripts: true

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true

overrides:
  "@electron/rebuild": 4.0.4
  yauzl: ^3.3.1
